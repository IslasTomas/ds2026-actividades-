<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Libreria Digital </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio  <i class="bi bi-house-door" aria-hidden="true"></i></a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="libro.html">Libro <i class="bi bi-book" aria-hidden="true"></i></a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="catalogo.html">Catalogo <i class="bi bi-list-check" aria-hidden="true"></i></a>
                </li>
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="contacto.html">Contacto  <i class="bi bi-journal-text" aria-hidden="true"></i></a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="mb-4">Contacto</h1>
        <p class="text-muted mb-4">Completa el formulario. Los campos con * son obligatorios.</p>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form action="#" method="get" class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="contactoNombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="contactoNombre" name="nombre" required autocomplete="name" placeholder="Tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="contactoEmail" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="contactoEmail" name="email" required autocomplete="email" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="contactoAsunto" class="form-label">Asunto <span class="text-danger">*</span></label>
                            <select class="form-select" id="contactoAsunto" name="asunto" required>
                                <option value="" selected disabled>Elegi una opcion</option>
                                <option value="consulta">Consulta</option>
                                <option value="reclamo">Reclamo</option>
                                <option value="sugerencia">Sugerencia</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="contactoMensaje" class="form-label">Mensaje <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="contactoMensaje" name="mensaje" rows="5" required placeholder="Escribi tu mensaje aqui"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
