</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Libreria Digital </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio  <i class="bi bi-house-door" aria-hidden="true"></i></a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="libro.html">Libro <i class="bi bi-book"></i></a>
                </li>
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="catalogo.html">Catalogo <i class="bi bi-list-check"></i></a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto  <i class="bi bi-journal-text" aria-hidden="true"></i></a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="mb-4">Catalogo</h1>

        <div class="row g-2 mb-3 align-items-end">
            <div class="col-md-8 col-lg-6">
                <label for="catalogoBuscadorInput" class="form-label text-body-secondary">Buscar en Open Library</label>
                <input type="text" class="form-control" id="catalogoBuscadorInput" placeholder="Titulo o autor" autocomplete="off">
            </div>
            <div class="col-md-4 col-lg-2 d-grid d-md-block">
                <button type="button" class="btn btn-primary w-100" id="catalogoBuscadorBtn">Buscar</button>
            </div>
        </div>

        <p id="catalogoValidacion" class="text-danger small d-none mb-2" role="alert"></p>
        <div id="catalogoError" class="alert alert-warning d-none py-2 mb-3" role="alert"></div>
        <p id="catalogoCargando" class="text-muted d-none mb-3">Cargando...</p>

        <div id="catalogoResultados"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
